# 隔离维护网 · 设备域密钥轮换服务 + 验收入口。
# 运行验收：docker compose up --build --exit-code-from verify verify
# （verify 跑完单元测试、构建检查与 HTTP 冒烟后退出，退出码即验收结果。）

services:
  app:
    build: .
    image: maintenance-rotation:local
    environment:
      PORT: "3000"
      DATA_DIR: /data
      # 仅验收环境开启：允许通过接口触发进程退出，由重启策略拉起，以验证重启一致性。
      ALLOW_ADMIN_RESTART: "1"
    volumes:
      - rotation-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - "3000:3000"

  verify:
    build: .
    image: maintenance-rotation:local
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:3000
    command: ["node", "scripts/verify.js"]
    restart: "no"

volumes:
  rotation-data:
